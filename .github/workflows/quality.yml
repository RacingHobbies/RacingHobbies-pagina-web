name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run regression tests
        run: node --test scripts/*.test.mjs
      - name: Audit security policy
        run: bash scripts/security-audit.sh
      - name: Verify production bundles
        run: bash scripts/verify-build-freshness.sh
      - name: Build Cloudflare package
        run: node scripts/package-production.mjs --target=cloudflare
